<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Asystent — brak połączenia</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0f1115; color: #f2f4f8;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; text-align: center; }
  p { color: #9aa3b2; max-width: 32ch; margin: 8px auto 20px; }
  button { font: inherit; background: #4f8cff; color: #fff; border: 0; border-radius: 12px; padding: 12px 20px; min-height: 44px; }
</style>
</head>
<body>
  <main>
    <h1>Brak połączenia</h1>
    <p>Zadania, które już działają, wykonują się dalej na serwerze. Wróć, gdy będzie internet.</p>
    <button type="button" onclick="location.reload()">Spróbuj ponownie</button>
  </main>
</body>
</html>
